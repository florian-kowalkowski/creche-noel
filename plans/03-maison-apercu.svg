<text x="14.00" y="186.00" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">PIÈCES - contreplaqué 3 mm (une plaque de 60 × 30 cm suffit)</text>
<text x="14.00" y="191.50" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">A  façade avant 100 × 265, avec 2 fenêtres et la sortie d'eau</text>
<text x="14.00" y="196.30" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">B  façade arrière 100 × 265</text>
<text x="14.00" y="201.10" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">C, D  côtés 74 × 220, collés entre les deux façades</text>
<text x="14.00" y="205.90" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">E, F  pans de toit 85 × 100 et 82 × 100 (support de l'écorce)</text>
<text x="14.00" y="210.70" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">G  2 raidisseurs 74 × 94, à plat à l'intérieur, à 100 et 215 mm du bas</text>
<text x="14.00" y="215.50" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">H  parement brique 92 × 40    I  auvent 98 × 35    J  4 volets 11 × 30</text>
<text x="14.00" y="220.30" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">K  porte 17 × 34    L  2 consoles d'auvent</text>
<text x="14.00" y="225.10" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">Hors plaque : 4 chevrons en baguette ronde Ø 6, longueur 36 mm</text>
<text x="14.00" y="233.90" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">MONTAGE</text>
<text x="14.00" y="239.40" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">1. Découper les fenêtres avant le contour : percer, passer la lame, scier.</text>
<text x="14.00" y="244.20" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">2. Coller C et D entre A et B, avec les raidisseurs G pour tenir l'équerre.</text>
<text x="14.00" y="249.00" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">3. Peindre les murs, puis coller brique, volets, porte, consoles et auvent.</text>
<text x="14.00" y="253.80" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">4. Poser le pan F, puis E par-dessus. Le jour au faîtage disparaît sous l'écorce.</text>
<text x="14.00" y="258.60" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">5. Ne pas coller la maison sur le socle avant d'avoir posé le tuyau (étape rivière).</text>
</svg>