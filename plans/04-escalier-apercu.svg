<text x="162.20" y="161.00" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle">54</text>
<text x="162.20" y="48.80" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="rgb(31,84,178)" text-anchor="middle">mur S, 195 de haut</text>
<text x="183.00" y="73.40" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">palier 60 :</text>
<text x="183.00" y="76.90" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">touche la maison</text>
<text x="14.00" y="168.00" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">DÉBIT : 9 blocs dans une planche de 15 mm</text>
<text x="14.00" y="174.00" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B1 : 54 × 140 mm  (en bas)</text>
<text x="14.00" y="178.60" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B2 : 54 × 126,5 mm</text>
<text x="14.00" y="183.20" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B3 : 54 × 113 mm</text>
<text x="14.00" y="187.80" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B4 : 54 × 99,5 mm</text>
<text x="14.00" y="192.40" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B5 : 54 × 86 mm</text>
<text x="80.00" y="174.00" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B6 : 54 × 72,5 mm</text>
<text x="80.00" y="178.60" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B7 : 54 × 59 mm</text>
<text x="80.00" y="183.20" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B8 : 54 × 45,5 mm</text>
<text x="80.00" y="187.80" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">B9 : 60 × 32 mm  (palier)</text>
<text x="146.00" y="174.00" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">Mur S : 64 × 195,</text>
<text x="146.00" y="178.60" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="start">contreplaqué 5 mm</text>
<text x="14.00" y="205.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">MONTAGE</text>
<text x="14.00" y="209.40" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">1. Débiter une bande de 54 mm de large sur toute la longueur de la planche (largeur des marches).</text>
<text x="14.00" y="213.80" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">    Puis recouper à la longueur de chaque bloc. Le palier B9 se coupe à part, en 60 mm de large.</text>
<text x="14.00" y="218.20" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">2. Poncer les faces visibles et marquer au crayon le dos de chaque bloc : tous les dos sont alignés.</text>
<text x="14.00" y="222.60" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">3. Coller B1 sur le socle, dos contre le mur du fond. Puis B2 sur B1, dos alignés, côté gauche aligné,</text>
<text x="14.00" y="227.00" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">    et ainsi de suite jusqu'à B9. Serrer avec un serre-joint ou un poids pendant le séchage.</text>
<text x="14.00" y="231.40" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">4. Le palier B9 dépasse de 6 mm côté maison : il vient toucher le mur, juste sous la porte.</text>
<text x="14.00" y="235.80" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">5. Coller le mur S (et son parement de briques) contre le dos de l'escalier.</text>
<text x="14.00" y="242.20" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">FINITION</text>
<text x="14.00" y="246.60" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">Les tranches du contreplaqué se voient sur les côtés et les contremarches : les masquer avec du liège</text>
<text x="14.00" y="251.00" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">en feuille de 2 mm, de l'écorce, ou de l'enduit de rebouchage peint en pierre. Dessus des marches :</text>
<text x="14.00" y="255.40" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">liège en feuille ou peinture sablée. Un jus brun dans les angles des marches les vieillit.</text>
<text x="14.00" y="261.80" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">PORTE</text>
<text x="14.00" y="266.20" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">Le palier est à 135 mm (5 mm plus haut qu'avec l'ancien escalier) : la porte imprimée se colle avec</text>
<text x="14.00" y="270.60" font-family="Helvetica,Arial,sans-serif" font-size="2.75" fill="rgb(0,0,0)" text-anchor="start">son seuil posé sur le palier, le vantail de Y 137 à 171 sur le côté C de la maison.</text>
</svg>