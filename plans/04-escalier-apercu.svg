<text x="182.20" y="60.00" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="rgb(31,84,178)" text-anchor="middle">mur S</text>
<text x="182.20" y="75.60" font-family="Helvetica,Arial,sans-serif" font-size="2.5" fill="rgb(31,84,178)" text-anchor="middle">palier R, vers la porte à droite</text>
<text x="14.00" y="176.00" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">PIÈCES</text>
<text x="14.00" y="181.50" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">M, N  limons gauche et droit, contreplaqué 5 mm, 150 × 142</text>
<text x="14.00" y="186.30" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">O  2 crémaillères, contreplaqué 3 mm, 137 × 127</text>
<text x="14.00" y="191.10" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">P  9 marches 44 × 15    Q  10 contremarches 44 × 10    R  palier 55 × 32  (3 mm)</text>
<text x="14.00" y="195.90" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">S  mur de briques, contreplaqué 5 mm, 64 × 195</text>
<text x="14.00" y="204.70" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">MONTAGE</text>
<text x="14.00" y="210.20" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">1. Coller une crémaillère O sur la face intérieure de chaque limon, sur le tireté :</text>
<text x="14.00" y="215.00" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">    bas et arrière alignés. Attention, les deux limons se font en miroir.</text>
<text x="14.00" y="219.80" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">2. Réunir les deux limons par le palier R et la première contremarche Q,</text>
<text x="14.00" y="224.60" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">    avec 44 mm entre eux. Vérifier l'équerre et laisser sécher.</text>
<text x="14.00" y="229.40" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">3. Monter de bas en haut : une contremarche, puis la marche posée dessus.</text>
<text x="14.00" y="234.20" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">    Chaque marche passe sous la contremarche suivante.</text>
<text x="14.00" y="239.00" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">4. Coller le mur S au dos de l'escalier, centré.</text>
<text x="14.00" y="243.80" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">5. Finition : liège en feuille de 2 mm sur les marches, ou peinture sablée.</text>
<text x="14.00" y="248.60" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">    Sur le mur, graver les joints de briques au cutter avant peinture.</text>
<text x="14.00" y="257.40" font-family="Helvetica,Arial,sans-serif" font-size="3.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">SUR LE SOCLE</text>
<text x="14.00" y="262.90" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">L'escalier se place sur le tracé bleu du plan du socle, palier contre le mur du fond,</text>
<text x="14.00" y="267.70" font-family="Helvetica,Arial,sans-serif" font-size="2.9" fill="rgb(0,0,0)" text-anchor="start">limon droit N à 6 mm du mur gauche de la maison. Le palier R comble cet espace.</text>
</svg>