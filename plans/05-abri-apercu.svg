<text x="18.00" y="186.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(0,0,0)" text-anchor="start">Poteaux : Ø 17 à 30 du bord et 13 de l'avant ; Ø 12 à 19 du bord et 34 de l'avant.</text>
<text x="116.00" y="128.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">ÉCORCE DE LIÈGE</text>
<text x="116.00" y="133.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Écorce brute (liège vierge), vendue pour les</text>
<text x="116.00" y="137.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">crèches et les terrariums. Prévoir large :</text>
<text x="116.00" y="142.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">3 ou 4 plaques d'environ 30 × 20 cm.</text>
<text x="116.00" y="146.40" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Elle se casse à la main ou se scie.</text>
<text x="116.00" y="150.80" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Collage : pistolet à colle, ou colle à bois</text>
<text x="116.00" y="155.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">et épingles le temps du séchage.</text>
<text x="116.00" y="159.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Les joints se cachent sous la mousse.</text>
<text x="14.00" y="196.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">PIÈCES - contreplaqué 5 mm</text>
<text x="14.00" y="201.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">T  joue gauche 165 × 160 (gabarit)        U  joue droite 95 × 198 (gabarit)</text>
<text x="14.00" y="205.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">V  paroi du fond 220 × 198 (rectangle)    X  toit 195 × 113 (rectangle)</text>
<text x="14.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">W  4 équerres de renfort 40 × 40 (gabarit)</text>
<text x="14.00" y="214.40" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Poteaux : 2 branches bien sèches, Ø 17 × 186 mm et Ø 12 × 188 mm (ou tourillons).</text>
<text x="14.00" y="222.30" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">MONTAGE</text>
<text x="14.00" y="227.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">1. Coller la paroi V entre les joues T et U, au ras de leur chant arrière. Renforcer</text>
<text x="14.00" y="231.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    chaque angle avec deux équerres W, côté intérieur, en haut et en bas.</text>
<text x="14.00" y="236.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">2. Coller ce U sur le socle : la paroi à 5 mm du bord arrière, la joue U contre le mur</text>
<text x="14.00" y="240.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    de briques de l'escalier.</text>
<text x="14.00" y="245.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">3. Coller les poteaux debout sur le socle, sur les ronds bleus du plan du socle.</text>
<text x="14.00" y="249.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Ils descendent jusqu'au sol : l'écorce du rebord et du pilier viendra les entourer.</text>
<text x="14.00" y="253.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">4. Poser le toit X à blanc : l'arrière sur la paroi V, l'avant sur les poteaux.</text>
<text x="14.00" y="258.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Recouper les poteaux si besoin, puis coller.</text>
<text x="14.00" y="262.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">5. Habiller d'écorce : paroi, face intérieure et dessus des joues, pilier autour du</text>
<text x="14.00" y="267.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    poteau Ø 12, rebord autour du poteau Ø 17, puis le dessus du toit.</text>
<text x="14.00" y="271.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Laisser libre le milieu du toit pour les tuiles (étape impression 3D).</text>
</svg>