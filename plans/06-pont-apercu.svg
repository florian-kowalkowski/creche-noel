<text x="140.00" y="120.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">tireté bleu : les deux longerons,</text>
<text x="140.00" y="124.40" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">au ras des bouts de planches.</text>
<text x="140.00" y="133.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">ronds : poteaux, collés contre</text>
<text x="140.00" y="137.40" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">le chant extérieur.</text>
<text x="24.26" y="131.50" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="end">37</text>
<text x="14.00" y="166.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">PIÈCES</text>
<text x="14.00" y="171.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Y  2 longerons arqués, contreplaqué 5 mm, 105 × 18 (gabarit page suivante)</text>
<text x="14.00" y="175.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Z  10 planches de 37 × 10 mm : bâtonnets de glace de 10 mm de large recoupés,</text>
<text x="14.00" y="180.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    ou bandes de contreplaqué 3 mm</text>
<text x="14.00" y="184.40" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">8 poteaux : pique à brochette en bambou Ø 3 mm, longueur 38 mm</text>
<text x="14.00" y="188.80" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">4 lisses : pique à brochette Ø 2,5 à 3 mm, longueur 115 mm</text>
<text x="14.00" y="196.70" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">MONTAGE</text>
<text x="14.00" y="201.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">1. Poser les deux longerons debout, à 37 mm hors tout (27 mm entre eux).</text>
<text x="14.00" y="206.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Les caler avec deux chutes le temps du collage.</text>
<text x="14.00" y="210.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">2. Coller les planches en partant du milieu, avec 1 mm de jour entre elles.</text>
<text x="14.00" y="215.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">3. Coller les 8 poteaux contre le chant extérieur des longerons, bien verticaux,</text>
<text x="14.00" y="219.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    le pied au niveau du dessous du longeron. Les deux du milieu dépassent plus haut.</text>
<text x="14.00" y="223.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">4. Tremper les lisses 10 minutes dans l'eau chaude, les cintrer sur le tracé bleu</text>
<text x="14.00" y="228.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    de la vue de côté, laisser sécher sous un poids, puis les coller sur les poteaux.</text>
<text x="14.00" y="232.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">5. Recouper les têtes de poteaux à 2 mm au-dessus de la lisse haute.</text>
<text x="14.00" y="237.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">6. Teinter au brou de noix dilué, puis brosser un peu de blanc à sec.</text>
<text x="14.00" y="245.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">SUR LE SOCLE</text>
<text x="14.00" y="250.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le pont enjambe la rivière sur le rectangle bleu marqué PONT du plan du socle.</text>
<text x="14.00" y="254.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Ne le coller qu'une fois le bac de rivière en place : ses talons reposent sur les berges.</text>
</svg>