<text x="140.00" y="44.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">tireté bleu : les deux lisses.</text>
<text x="140.00" y="48.40" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">Cintrer les baguettes sur</text>
<text x="140.00" y="52.80" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">ce tracé avant de coller.</text>
<text x="140.00" y="62.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">8 poteaux Ø 3</text>
<text x="140.00" y="70.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">10 planches Z</text>
<text x="140.00" y="78.00" font-family="Helvetica,Arial,sans-serif" font-size="2.6" fill="rgb(31,84,178)" text-anchor="start">longeron Y</text>
<text x="14.00" y="104.00" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">VUE DE DESSUS</text>
