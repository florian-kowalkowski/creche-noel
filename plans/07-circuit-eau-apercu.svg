<polygon points="174.10,106.40 176.20,106.40 176.20,120.80 184.60,120.80 184.60,92.00 183.20,92.00 183.20,117.60 174.10,117.60" fill="none" stroke="rgb(0,0,0)" stroke-width="0.5" stroke-linejoin="round"/>
