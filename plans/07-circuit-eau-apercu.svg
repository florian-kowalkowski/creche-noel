<text x="160.80" y="159.20" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="middle">pompe</text>
<text x="46.00" y="47.20" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">1 seuil</text>
<text x="100.60" y="87.20" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">2 bac de rivière</text>
<text x="156.60" y="85.60" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">3 bassin</text>
<text x="133.50" y="152.80" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">4 réservoir</text>
<text x="69.10" y="82.40" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">cascade : 21 mm</text>
<text x="88.00" y="100.80" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">4 mm d'eau</text>
<text x="173.40" y="95.20" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="middle">trop-plein</text>
<text x="88.00" y="144.80" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(199,46,26)" text-anchor="start">tuyau souple, sous le plateau</text>
<text x="14.00" y="196.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">COMMENT ÇA MARCHE</text>
<text x="14.00" y="201.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">La pompe, au fond du réservoir, pousse l'eau dans le tuyau jusqu'au seuil, à l'intérieur de la maison.</text>
<text x="14.00" y="205.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">L'eau sort par l'ouverture de la façade et tombe de 21 mm dans le bac de rivière : c'est la cascade.</text>
<text x="14.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Un déversoir au bout du bac garde 4 mm d'eau dans la rivière, même pompe arrêtée.</text>
<text x="14.00" y="214.40" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">L'eau passe par le bec dans le bassin, 3 mm plus bas, puis retombe au réservoir par le trop-plein.</text>
<text x="14.00" y="218.80" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le bassin n'est pas collé : on le soulève pour atteindre la pompe et pour remettre de l'eau.</text>
<text x="14.00" y="226.70" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">À SAVOIR</text>
<text x="14.00" y="231.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Pompe : uniquement une mini pompe immergée en basse tension (USB 5 V), à débit réglable.</text>
<text x="14.00" y="236.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Pompe retenue : 38 × 37 × 28 mm, embout de 8,4 mm sur le dessus. La coucher sur le flanc dans</text>
<text x="14.00" y="240.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    la partie gauche du réservoir, ventouses contre la paroi, embout vers la droite, grille dégagée.</text>
<text x="14.00" y="245.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Jamais de pompe en 230 V dans un caisson en bois.</text>
<text x="14.00" y="249.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Tuyau : silicone 8 × 10 mm ; le logement du seuil est prévu pour 10 mm extérieur. Si le vôtre</text>
<text x="14.00" y="253.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    est différent, changer TUBE_OD en tête du script generer_pieces_3d.py et le relancer.</text>
<text x="14.00" y="258.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Eau : environ 350 mL en tout. Compléter chaque semaine ; l'eau déminéralisée évite le calcaire.</text>
<text x="14.00" y="262.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le socle doit être de niveau, sinon la rivière se vide d'un côté.</text>
</svg>