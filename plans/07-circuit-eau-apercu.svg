<polygon points="55.80,40.80 57.90,40.80 57.90,21.60 55.80,21.60" fill="none" stroke="rgb(140,102,51)" stroke-width="0.3" stroke-linejoin="round"/>
<text x="20.80" y="102.40" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(140,102,51)" text-anchor="start">plateau 20 mm</text>
<text x="20.80" y="175.20" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(140,102,51)" text-anchor="start">fond 5 mm</text>
<text x="59.30" y="32.80" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(140,102,51)" text-anchor="start">façade</text>
