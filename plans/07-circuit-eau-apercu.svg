<polygon points="60.35,92.00 60.35,106.40 141.20,106.40 141.20,98.40 139.80,98.40 139.80,103.20 123.00,103.20 61.75,100.80 61.75,92.00" fill="none" stroke="rgb(0,0,0)" stroke-width="0.5" stroke-linejoin="round"/>
<polyline points="88.00,81.44 139.80,81.44" fill="none" stroke="rgb(31,84,178)" stroke-width="0.25" stroke-linejoin="round" stroke-dasharray="3 1.5"/>
