<polyline points="124.68,127.20 188.52,127.20" fill="none" stroke="rgb(31,84,178)" stroke-width="0.6" stroke-linejoin="round"/>
<polygon points="148.20,168.16 173.40,168.16 173.40,146.40 148.20,146.40" fill="none" stroke="rgb(31,84,178)" stroke-width="0.25" stroke-linejoin="round" stroke-dasharray="3 1.5"/>
<text x="160.80" y="159.20" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="middle">pompe</text>
<text x="46.00" y="42.40" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">1 seuil</text>
<text x="100.60" y="87.20" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">2 bac de rivière</text>
<text x="156.60" y="85.60" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">3 bassin</text>
<text x="133.50" y="152.80" font-family="Helvetica,Arial,sans-serif" font-size="2.8" fill="rgb(0,0,0)" text-anchor="middle" font-weight="bold">4 réservoir</text>
<text x="74.00" y="84.00" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">jet : chute de 19 mm</text>
<text x="88.00" y="112.00" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">lit en pente, 2 à 3 mm d'eau</text>
<text x="90.80" y="77.60" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="start">berges : 5 mm au-dessus de la collerette</text>
<text x="141.20" y="111.20" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="end">chute</text>
<text x="173.40" y="95.20" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(31,84,178)" text-anchor="middle">trop-plein</text>
<text x="88.00" y="144.80" font-family="Helvetica,Arial,sans-serif" font-size="2.4" fill="rgb(199,46,26)" text-anchor="start">tuyau souple, sous le plateau</text>
<text x="14.00" y="196.00" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">COMMENT ÇA MARCHE</text>
<text x="14.00" y="201.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">La pompe, au fond du réservoir, pousse l'eau dans le tuyau jusqu'au seuil, à l'intérieur de la maison.</text>
<text x="14.00" y="205.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le tuyau traverse tout le seuil dans un fourreau courbe et sort par sa bouche, sous l'arche de la façade :</text>
<text x="14.00" y="210.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    aucun raccord, donc aucune fuite cachée. L'eau en sort et retombe 19 mm plus bas dans la rivière.</text>
<text x="14.00" y="214.40" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le lit descend de 1,5 mm vers l'aval. Au bout, un déversoir de 28 mm de large garde 3 mm d'eau</text>
<text x="14.00" y="218.80" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">pompe arrêtée. Des berges de 5 mm, imprimées avec le bac, retiennent l'eau en marche.</text>
<text x="14.00" y="223.20" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">L'eau tombe du déversoir sur la lèvre du bassin, puis dans le bassin, 5 mm plus bas : c'est la chute.</text>
<text x="14.00" y="227.60" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Elle retombe au réservoir par le trop-plein, un tube de 15 mm qui avale le débit sans faire monter l'eau.</text>
<text x="14.00" y="232.00" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le bassin n'est pas collé : on le soulève pour atteindre la pompe et pour remettre de l'eau.</text>
<text x="14.00" y="239.90" font-family="Helvetica,Arial,sans-serif" font-size="3.1" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">À SAVOIR</text>
<text x="14.00" y="245.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Pompe : uniquement une mini pompe immergée en basse tension (USB 5 V), à débit réglable.</text>
<text x="14.00" y="249.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Pompe retenue : 38 × 37 × 28 mm, embout de 8,4 mm sur le dessus. La coucher sur le flanc dans</text>
<text x="14.00" y="253.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    la partie gauche du réservoir, ventouses contre la paroi, embout vers la droite, grille dégagée.</text>
<text x="14.00" y="258.30" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    Jamais de pompe en 230 V dans un caisson en bois.</text>
<text x="14.00" y="262.70" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Tuyau : silicone 8 × 10 mm ; le fourreau du seuil fait 11,5 mm, courbe de 18 mm de rayon. Si le vôtre</text>
<text x="14.00" y="267.10" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">    est différent, changer TUBE_BORE et BEND_R en tête du script generer_pieces_3d.py et le relancer.</text>
<text x="14.00" y="271.50" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Eau : environ 350 mL en tout. Compléter chaque semaine ; l'eau déminéralisée évite le calcaire.</text>
<text x="14.00" y="275.90" font-family="Helvetica,Arial,sans-serif" font-size="2.7" fill="rgb(0,0,0)" text-anchor="start">Le socle doit être de niveau, sinon la rivière se vide d'un côté.</text>
</svg>