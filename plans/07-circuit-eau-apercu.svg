<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="100%" height="100%" fill="white"/>
<text x="14.00" y="14.00" font-family="Helvetica,Arial,sans-serif" font-size="5.5" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">Crèche en liège - étape 7 : le circuit d'eau</text>
<text x="14.00" y="20.00" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="rgb(0,0,0)" text-anchor="start">Schéma en coupe le long de la rivière. Hauteurs agrandies, longueurs raccourcies : ne rien mesurer dessus.</text>
<polygon points="18.00,180.00 193.00,180.00 193.00,172.00 18.00,172.00" fill="none" stroke="rgb(140,102,51)" stroke-width="0.3" stroke-linejoin="round"/>
