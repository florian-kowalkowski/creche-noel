<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="100%" height="100%" fill="white"/>
<text x="14.00" y="14.00" font-family="Helvetica,Arial,sans-serif" font-size="5.2" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">Crèche en liège - tuiles canal en argile autodurcissante</text>
<text x="14.00" y="20.00" font-family="Helvetica,Arial,sans-serif" font-size="3" fill="rgb(0,0,0)" text-anchor="start">Fabrication par fournées de 4 tuiles avec le moule imprimé en 3D.</text>
<text x="14.00" y="32.00" font-family="Helvetica,Arial,sans-serif" font-size="3.4" fill="rgb(0,0,0)" text-anchor="start" font-weight="bold">La tuile finie (après séchage), dessin agrandi 3 fois</text>
